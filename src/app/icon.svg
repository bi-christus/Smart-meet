<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Smart Meet">
  <!--
    Marca do Smart Meet: uma onda de áudio.
    A entrada do produto é sempre uma gravação, e quatro barras é o máximo de
    detalhe que ainda se distingue a 16px — cinco viram borrão na aba.
  -->
  <rect width="32" height="32" rx="7" fill="#ff6a2b"/>
  <g fill="#fff">
    <rect x="6.5"  y="10" width="3.6" height="12" rx="1.8"/>
    <rect x="12.2" y="6"  width="3.6" height="20" rx="1.8"/>
    <rect x="17.9" y="9"  width="3.6" height="14" rx="1.8"/>
    <rect x="23.6" y="12" width="3.6" height="8"  rx="1.8"/>
  </g>
</svg>
